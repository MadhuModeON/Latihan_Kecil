async function playsong() {
let i = 0;

const loop = setInterval(() => {
    if (i >= chart.length) {
        clearInterval(loop);
        return;
    }

    if (chart[i].time < selectedsound.currentTime * 1000) {
    chart[i].actions.forEach(action => {
        actionchart[action]();
        
        });
        i++;
    }
}, 1);

}

let lasttime = 0;
function game(currentTime) {
let deltatime = (currentTime - lasttime) / 1000;
lasttime = currentTime;
arrowfall(deltatime);
draw();
requestAnimationFrame(game);
}
requestAnimationFrame(game);

function arrowfall(deltatime) {
arrows.forEach(fallarrow => {
fallarrow.y += selectedstats.speed * deltatime;
if (fallarrow.y > 320) {
arrows.splice(arrows.indexOf(fallarrow), 1);
combo = 0;
miss += 1;
hits += 1;
accu();
}
});
}

function draw() {
ctx.clearRect(0, 0, canvas.width, canvas.height)
for (let i = 0; i < arrow.length; i++) {
ctx.globalAlpha = 1;
ctx.fillStyle = arrow[i].background;
ctx.fillRect(arrow[i].x, arrow[i].y, arrow[i].width, arrow[i].height);
ctx.strokeRect(arrow[i].x, arrow[i].y, arrow[i].width, arrow[i].height);
}
whitearrow.forEach(arrow => {
ctx.globalAlpha = arrow.opacity;
ctx.fillStyle = arrow.background;
ctx.fillRect(arrow.x, arrow.y, arrow.width, arrow.height);
ctx.strokeRect(arrow.x, arrow.y, arrow.width, arrow.height);
});
arrows.forEach(arrows => {
ctx.globalAlpha = 1;
ctx.fillStyle = arrows.background;
ctx.fillRect(arrows.x, arrows.y, arrows.width, arrows.height);
ctx.strokeRect(arrows.x, arrows.y, arrows.width, arrows.height);
});

}
