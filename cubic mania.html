<!doctype html>
<head>
<style>
html, body {
    overflow: hidden;
    touch-action: none;
    user-select: none;
}
canvas {
border: 2px solid black;
background: white;
position: fixed;
opacity: 1;
top: -5;
left: 282px;
}
button {
width: 210px;
height: 300px;
opacity: 0.08;
background: purple;
position: fixed;
border: 1px solid black;
top: -5;
left: 0;
}
.menu {
width: 170px;
height: 40px;
background: blue;
border: 2px solid black;
position: fixed;
font-Size: 33px;
color: white;
text-align: center;
top: 50;
left: 50;
}
</style>
</head>
<body>
<div>Cubic Mania</div>
<canvas id="game" width="260px" height="300px"></canvas>
<button id="left"></button>
<button id="up" style="left: 210px; background: green;"></button>
<button id="down" style="left: 420px; background: cyan;"></button>
<button id="right" style="left: 630px; background: red;"></button>
<div class="menu" id="start">Start</div>
<div id="poin">Poin: 0</div>
<script>
let canvas = document.getElementById("game")
ctx = canvas.getContext("2d")
let wait = ms => new Promise(resolve => setTimeout(resolve, ms));
let poin = 0
let arrow = [
{
x: 5,
y: 240,
width: 50,
height: 50,
background: "purple",
},
{
x: 70,
y: 240,
width: 50,
height: 50,
background: "green",
},
{
x: 135,
y: 240,
width: 50,
height: 50,
background: "cyan",
},
{
x: 200,
y: 240,
width: 50,
height: 50,
background: "red",
}
]

let fallarrow = [
{
x: 5,
y: -50,
width: 50,
height: 50,
background: "purple",
},
{
x: 70,
y: -50,
width: 50,
height: 50,
background: "green",
},
{
x: 135,
y: -50,
width: 50,
height: 50,
background: "cyan",
},
{
x: 200,
y: -50,
width: 50,
height: 50,
background: "red",
}
]


let arrows = []
let megalovania = [
//buat dengan rhyme maker
]

const song1 = new Audio("MEGALOVANIA.mp3")
let startbtn = document.getElementById("start")
let active = false
startbtn.addEventListener("click", async function() {
if (active == false) {
active = true
playsong()
for (let i = 100; i < 0; i--) {
startbtn.style.opacity = i / 100
}

song1.play()
}
});
async function playsong() {
for (let i = 0; i < megalovania.length; i++) {
megalovania[i].actions.forEach(actions => {
actions()
});
await wait(megalovania[i].wait)
}
}

function right() {
arrows.push({...fallarrow[0]})

}
function up() {
arrows.push({...fallarrow[1]})

}
function left() {
arrows.push({...fallarrow[2]})

}
function down() {
arrows.push({...fallarrow[3]})

}


let lasttime = 0
function game(currentTime) {
let deltatime = (currentTime - lasttime) / 1000
lasttime = currentTime
arrowfall(deltatime)
draw()
requestAnimationFrame(game)
}
requestAnimationFrame(game)

function arrowfall(deltatime) {
arrows.forEach(arrows => {
arrows.y += 300 * deltatime
});
}

function draw() {
ctx.clearRect(0, 0, canvas.width, canvas.height)
for (let i = 0; i < arrow.length; i++) {
ctx.fillStyle = arrow[i].background
ctx.fillRect(arrow[i].x, arrow[i].y, arrow[i].width, arrow[i].height)
ctx.strokeRect(arrow[i].x, arrow[i].y, arrow[i].width, arrow[i].height)
}
arrows.forEach(arrows => {
ctx.fillStyle = arrows.background
ctx.fillRect(arrows.x, arrows.y, arrows.width, arrows.height)
ctx.strokeRect(arrows.x, arrows.y, arrows.width, arrows.height)
});
}




upbtn = document.getElementById("up")
downbtn = document.getElementById("down")
leftbtn = document.getElementById("left")
rightbtn = document.getElementById("right")

upbtn.addEventListener("pointerdown", function() {
let target = arrow[1]
let selected = false
arrows.forEach(fallarrows => {
if (fallarrows.x < target.x + target.width &&
fallarrows.x + fallarrows.width > target.x &&
fallarrows.y < target.y + target.height &&
fallarrows.y + fallarrows.height > target.y && selected == false && fallarrows.background && target.background == "green") {
selected = true
let center = fallarrows.y + fallarrows.height / 2;
let center2 = target.y + target.height / 2;
let jarak = Math.abs(center - center2);
let score = 50 - jarak
arrows.splice(arrows.indexOf(fallarrows), 1);
poin += score;
document.getElementById("poin").innerText = "Poin: " + Math.floor(poin)
}
});
});

downbtn.addEventListener("pointerdown", function() {
let target = arrow[2]
let selected = false
arrows.forEach(fallarrows => {
if (fallarrows.x < target.x + target.width &&
fallarrows.x + fallarrows.width > target.x &&
fallarrows.y < target.y + target.height &&
fallarrows.y + fallarrows.height > target.y && selected == false && fallarrows.background && target.background == "cyan") {
selected = true
let center = fallarrows.y + fallarrows.height / 2;
let center2 = target.y + target.height / 2;
let jarak = Math.abs(center - center2);
let score = 50 - jarak
arrows.splice(arrows.indexOf(fallarrows), 1);
poin += score;
document.getElementById("poin").innerText = "Poin: " + Math.floor(poin)
}
});
});

leftbtn.addEventListener("pointerdown", function() {
let target = arrow[0]
let selected = false
arrows.forEach(fallarrows => {
if (fallarrows.x < target.x + target.width &&
fallarrows.x + fallarrows.width > target.x &&
fallarrows.y < target.y + target.height &&
fallarrows.y + fallarrows.height > target.y && selected == false && fallarrows.background && target.background == "purple") {
selected = true
let center = fallarrows.y + fallarrows.height / 2;
let center2 = target.y + target.height / 2;
let jarak = Math.abs(center - center2);
let score = 50 - jarak
arrows.splice(arrows.indexOf(fallarrows), 1);
poin += score;
document.getElementById("poin").innerText = "Poin: " + Math.floor(poin)
}
});
});

rightbtn.addEventListener("pointerdown", function() {
let target = arrow[3]
let selected = false
arrows.forEach(fallarrows => {
if (fallarrows.x < target.x + target.width &&
fallarrows.x + fallarrows.width > target.x &&
fallarrows.y < target.y + target.height &&
fallarrows.y + fallarrows.height > target.y && selected == false && fallarrows.background && target.background == "red") {
selected = true
let center = fallarrows.y + fallarrows.height / 2;
let center2 = target.y + target.height / 2;
let jarak = Math.abs(center - center2);
let score = 50 - jarak
arrows.splice(arrows.indexOf(fallarrows), 1);
poin += score;
document.getElementById("poin").innerText = "Poin: " + Math.floor(poin)
}
});
});


</script>
</body>
</html>
